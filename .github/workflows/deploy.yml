name: Deploy production

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

      - name: Build production site
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${SSH_PRIVATE_KEY:?Set the DEPLOY_SSH_KEY environment secret}"
          : "${SSH_KNOWN_HOSTS:?Set the DEPLOY_KNOWN_HOSTS environment secret}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy over SFTP
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          : "${DEPLOY_HOST:?Set the DEPLOY_HOST repository variable}"
          : "${DEPLOY_USER:?Set the DEPLOY_USER repository variable}"
          : "${DEPLOY_PATH:?Set the DEPLOY_PATH repository variable}"
          if [[ ! "$DEPLOY_PATH" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH must contain only letters, numbers, dots, underscores, slashes, and hyphens"
            exit 1
          fi
          lftp -u "${DEPLOY_USER}," "sftp://${DEPLOY_HOST}:${DEPLOY_PORT}" <<EOF
          set cmd:fail-exit yes
          mirror --reverse --verbose "dist/breakpirates-v3/browser/" "${DEPLOY_PATH%/}"
          bye
          EOF
