<h1>{{'VIDEO.TITLE' | translate}}</h1>

@for (yearGroup of videosByYear(); track yearGroup.year) {
  <h2>{{yearGroup.year}}</h2>
  <ul class="list-unstyled">
    @for (video of yearGroup.videos; track video.id) {
      <li>
        <a [routerLink]="['/video',video.id]">{{video.name}}</a>
      </li>
    }
  </ul>
}
