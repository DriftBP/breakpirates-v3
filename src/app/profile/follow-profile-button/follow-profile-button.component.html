<button
  class="follow-profile-button btn btn-sm btn-outline-primary"
  type="button"
  [attr.aria-pressed]="isFollowing()"
  [attr.aria-label]="(isFollowing() ? 'PROFILES.UNFOLLOW' : 'PROFILES.FOLLOW_PROFILE') | translate: {name: profile().name}"
  (click)="toggleFollow()">
  {{(isFollowing() ? 'PROFILES.FOLLOWING' : 'PROFILES.FOLLOW') | translate}}
</button>
