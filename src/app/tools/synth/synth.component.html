<main class="synth">
  <header class="synth__header">
    <div>
      <p class="synth__eyebrow">BREAKPIRATES / SOUND LAB</p>
      <h1>Dual oscillator synth</h1>
      <p class="synth__intro">Wide detuned saws, a clean sub, and a gritty rolling filter.</p>
    </div>
    <div class="synth__status" [class.synth__status--live]="isPlaying">
      <span class="synth__status-dot"></span>{{ isPlaying ? 'SIGNAL LIVE' : 'STANDBY' }}
    </div>
  </header>

  <section class="synth__scope" aria-label="Live waveform display">
    <div class="synth__scope-top"><span>OUTPUT / TIME DOMAIN</span><span>{{ frequency }} HZ</span></div>
    <canvas #waveformCanvas class="synth__canvas" role="img" aria-label="Live audio waveform"></canvas>
    <div class="synth__scope-bottom"><span>-1</span><span>0</span><span>+1</span></div>
  </section>

  <div class="synth__transport">
    <button class="synth__play" type="button" (click)="togglePlayback()">
      {{ isPlaying ? 'Stop tone' : 'Start tone' }}
    </button>
    <button class="synth__accent-button" type="button" [disabled]="!isPlaying" (click)="triggerAccent()">
      Accent
    </button>
    <div class="synth__beat-control">
      <label for="beat-pattern">DRUM LOOP</label>
      <select id="beat-pattern" [(ngModel)]="selectedBeat">
        @for (beat of beatOptions; track beat.label; let index = $index) {
          <option [ngValue]="index">{{ index + 1 }} / {{ beat.label }}</option>
        }
      </select>
      <button class="synth__beat-button" type="button" [attr.aria-pressed]="isBeatPlaying" (click)="toggleBeat()">
        {{ isBeatPlaying ? 'Stop beat' : 'Start beat' }}
      </button>
      <label class="synth__beat-level-label" for="beat-level">BEAT LEVEL <output>{{ beatLevel }}%</output></label>
      <input id="beat-level" class="synth__beat-level" type="range" min="50" max="220" step="1" [(ngModel)]="beatLevel" (ngModelChange)="updateBeatLevel()">
    </div>
    <p class="synth__error" role="alert">{{ audioError }}</p>
  </div>

  <section class="synth__controls" aria-label="Synth controls">
    <div class="synth__section-heading"><span>01</span><h2>Oscillators</h2></div>
    <div class="synth__preset-control">
      <label for="bass-preset">BASS PRESET</label>
      <select id="bass-preset" [ngModel]="selectedPreset" (ngModelChange)="applyBassPreset($event)">
        @for (preset of bassPresets; track preset.name; let index = $index) {
          <option [ngValue]="index">{{ index + 1 }} / {{ preset.name }}</option>
        }
      </select>
    </div>
    <div class="synth__oscillators">
      <div class="synth__oscillator">
        <label class="synth__field-label" for="wave-a">Wave A <span>01</span></label>
        <select id="wave-a" [(ngModel)]="waveA" (ngModelChange)="updateSound()">
          @for (wave of waveOptions; track wave.value) {
            <option [value]="wave.value">{{ wave.label }}</option>
          }
        </select>
      </div>
      <div class="synth__oscillator">
        <label class="synth__field-label" for="wave-b">Wave B <span>02</span></label>
        <select id="wave-b" [(ngModel)]="waveB" (ngModelChange)="updateSound()">
          @for (wave of waveOptions; track wave.value) {
            <option [value]="wave.value">{{ wave.label }}</option>
          }
        </select>
      </div>
    </div>
    <label class="synth__slider-label" for="blend"><span>Wave blend</span><output>{{ blend }}% B</output></label>
    <input id="blend" class="synth__slider" type="range" min="0" max="100" step="1" [(ngModel)]="blend" (ngModelChange)="updateSound()">
    <label class="synth__slider-label" for="detune"><span>Oscillator spread</span><output>{{ detune }} cents</output></label>
    <input id="detune" class="synth__slider" type="range" min="0" max="40" step="1" [(ngModel)]="detune" (ngModelChange)="updateSound()">
    <label class="synth__slider-label" for="frequency"><span>Pitch</span><output>{{ frequency }} Hz</output></label>
    <input id="frequency" class="synth__slider" type="range" min="40" max="880" step="1" [(ngModel)]="frequency" (ngModelChange)="updateSound()">
  </section>

  <section class="synth__controls synth__controls--filters" aria-label="Filter and accent controls">
    <div class="synth__section-heading"><span>02</span><h2>Filter &amp; accent</h2></div>
    <label class="synth__slider-label" for="low-pass"><span>Low-pass cutoff</span><output>{{ lowPass }} Hz</output></label>
    <input id="low-pass" class="synth__slider" type="range" min="200" max="16000" step="10" [(ngModel)]="lowPass" (ngModelChange)="updateSound()">
    <label class="synth__slider-label" for="high-pass"><span>High-pass cutoff</span><output>{{ highPass }} Hz</output></label>
    <input id="high-pass" class="synth__slider" type="range" min="20" max="4000" step="10" [(ngModel)]="highPass" (ngModelChange)="updateSound()">
    <label class="synth__slider-label" for="resonance"><span>Resonance</span><output>{{ resonance.toFixed(1) }} Q</output></label>
    <input id="resonance" class="synth__slider" type="range" min="0.1" max="18" step="0.1" [(ngModel)]="resonance" (ngModelChange)="updateSound()">
    <label class="synth__slider-label" for="distortion"><span>Distortion drive</span><output>{{ distortion }}%</output></label>
    <input id="distortion" class="synth__slider" type="range" min="0" max="100" step="1" [(ngModel)]="distortion" (ngModelChange)="updateSound()">
    <label class="synth__slider-label" for="accent"><span>Accent amount</span><output>{{ accent }}%</output></label>
    <input id="accent" class="synth__slider" type="range" min="0" max="100" step="1" [(ngModel)]="accent" (ngModelChange)="updateSound()">
    <div class="synth__subsection-heading"><h3>Wobble LFO</h3><span>FILTER MODULATION</span></div>
    <label class="synth__slider-label" for="wobble-rate"><span>Wobble rate</span><output>{{ wobbleRate.toFixed(1) }} Hz</output></label>
    <input id="wobble-rate" class="synth__slider" type="range" min="0.5" max="12" step="0.1" [(ngModel)]="wobbleRate" (ngModelChange)="updateSound()">
    <label class="synth__slider-label" for="wobble-depth"><span>Wobble depth</span><output>{{ wobbleDepth }}%</output></label>
    <input id="wobble-depth" class="synth__slider" type="range" min="0" max="100" step="1" [(ngModel)]="wobbleDepth" (ngModelChange)="updateSound()">
  </section>
</main>
